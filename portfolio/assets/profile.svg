<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Sujan Giri profile placeholder</title>
  <desc id="desc">A dark circular placeholder with the letters SG in blue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111821"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="300" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#0d7ef2" stroke-width="8" opacity="0.9"/>
  <text x="300" y="350" text-anchor="middle" fill="#1d8df5" font-size="230" font-family="Arial, Helvetica, sans-serif" font-weight="700">SG</text>
</svg>
